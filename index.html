<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moodboard Generator</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F2ED;
    --surface: #FFFFFF;
    --surface2: #EFECE6;
    --border: rgba(0,0,0,0.1);
    --border2: rgba(0,0,0,0.18);
    --text: #1A1814;
    --text2: #6B6760;
    --text3: #A8A59F;
    --accent: #C4531A;
    --accent-bg: #FDF0EA;
    --l1: #3C3489; --l1-bg: #EEEDFE; --l1-border: #AFA9EC;
    --l2: #085041; --l2-bg: #E1F5EE; --l2-border: #5DCAA5;
    --l3: #633806; --l3-bg: #FAEEDA; --l3-border: #EF9F27;
    --radius: 10px;
    --radius-lg: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0;
  }

  /* HEADER */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.25rem 2rem;
    border-bottom: 0.5px solid var(--border2);
    background: var(--surface);
    position: sticky; top: 0; z-index: 100;
  }
  .logo { font-family: 'DM Serif Display', serif; font-size: 20px; letter-spacing: -0.02em; color: var(--text); }
  .logo span { color: var(--accent); font-style: italic; }
  .key-area { display: flex; align-items: center; gap: 10px; }
  .key-area label { font-size: 12px; color: var(--text3); }
  .key-area input {
    font-family: 'DM Sans', monospace; font-size: 12px;
    padding: 6px 12px; border-radius: 99px;
    border: 0.5px solid var(--border2);
    background: var(--bg); color: var(--text);
    width: 260px; letter-spacing: 0.02em;
  }
  .key-status { font-size: 11px; padding: 4px 10px; border-radius: 99px; }
  .key-status.ok { background: var(--l2-bg); color: var(--l2); }
  .key-status.no { background: #FEF2F2; color: #991B1B; }

  /* LAYOUT */
  .layout { display: grid; grid-template-columns: 380px 1fr; min-height: calc(100vh - 57px); }
  .sidebar {
    background: var(--surface);
    border-right: 0.5px solid var(--border2);
    padding: 1.5rem;
    overflow-y: auto;
    height: calc(100vh - 57px);
    position: sticky; top: 57px;
  }
  .main { padding: 2rem; overflow-y: auto; }

  /* MODE TOGGLE */
  .mode-toggle { display: flex; gap: 6px; margin-bottom: 1.75rem; }
  .mode-btn {
    flex: 1; padding: 8px 12px; border-radius: var(--radius);
    border: 0.5px solid var(--border2);
    background: transparent; color: var(--text2);
    font-family: 'DM Sans', sans-serif; font-size: 13px;
    cursor: pointer; transition: all 0.15s;
  }
  .mode-btn.active { background: var(--text); color: var(--bg); border-color: var(--text); }

  /* FORM */
  .sec-label {
    font-size: 10px; font-weight: 500; letter-spacing: 0.1em;
    color: var(--text3); text-transform: uppercase; margin-bottom: 10px;
  }
  .sec { margin-bottom: 1.5rem; }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 5px; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 8px 12px;
    border: 0.5px solid var(--border2); border-radius: var(--radius);
    background: var(--bg); color: var(--text);
    font-family: 'DM Sans', sans-serif; font-size: 13px;
    transition: border-color 0.15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none; border-color: var(--accent);
  }
  .field textarea { resize: none; height: 60px; line-height: 1.5; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .divider { border: none; border-top: 0.5px solid var(--border); margin: 0 0 1.5rem; }

  /* TAGS */
  .tag-group { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    font-size: 12px; padding: 4px 12px; border-radius: 99px;
    border: 0.5px solid var(--border2); cursor: pointer;
    background: var(--bg); color: var(--text2);
    transition: all 0.15s; user-select: none;
  }
  .tag:hover { border-color: var(--border2); background: var(--surface2); }
  .tag.am { background: var(--l1-bg); color: var(--l1); border-color: var(--l1-border); }
  .tag.as { background: var(--l2-bg); color: var(--l2); border-color: var(--l2-border); }
  .tag.ac { background: var(--l3-bg); color: var(--l3); border-color: var(--l3-border); }

  /* KEYWORDS */
  .kw-row { display: flex; gap: 7px; margin-top: 5px; }
  .kw-row input { flex: 1; }
  .kw-row button {
    padding: 0 14px; border: 0.5px solid var(--border2); border-radius: var(--radius);
    background: transparent; color: var(--text2); font-size: 13px;
    font-family: 'DM Sans', sans-serif; cursor: pointer;
  }
  .kw-row button:hover { background: var(--surface2); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip {
    display: flex; align-items: center; gap: 5px;
    font-size: 12px; padding: 3px 10px 3px 12px;
    background: var(--surface2); border: 0.5px solid var(--border);
    border-radius: 99px; color: var(--text);
  }
  .chip button { background: none; border: none; cursor: pointer; color: var(--text3); font-size: 14px; line-height: 1; }
  .chip button:hover { color: var(--text); }

  /* UPLOAD */
  .upload-zone {
    border: 0.5px dashed var(--border2); border-radius: var(--radius-lg);
    padding: 16px; text-align: center; background: var(--bg);
    cursor: pointer; color: var(--text3); font-size: 12px; margin-top: 6px;
    transition: border-color 0.15s;
  }
  .upload-zone:hover { border-color: var(--accent); }
  .upload-icon { font-size: 20px; margin-bottom: 4px; }
  .pinterest-btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; padding: 6px 12px; border-radius: var(--radius);
    border: 0.5px solid var(--border2); background: transparent;
    color: var(--text2); cursor: pointer; margin-top: 8px;
    font-family: 'DM Sans', sans-serif; text-decoration: none;
    transition: background 0.15s;
  }
  .pinterest-btn:hover { background: var(--surface2); }

  /* SUBMIT */
  .submit-row { display: flex; gap: 8px; margin-top: 1.25rem; }
  .btn-primary {
    flex: 1; padding: 11px;
    background: var(--accent); color: #fff;
    border: none; border-radius: var(--radius);
    font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500;
    cursor: pointer; transition: opacity 0.15s; letter-spacing: 0.01em;
  }
  .btn-primary:hover { opacity: 0.88; }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-clear {
    padding: 11px 16px; border: 0.5px solid var(--border2); border-radius: var(--radius);
    background: transparent; color: var(--text2);
    font-family: 'DM Sans', sans-serif; font-size: 13px; cursor: pointer;
  }
  .btn-clear:hover { background: var(--surface2); }

  /* MAIN / OUTPUT */
  .empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 60vh; text-align: center; color: var(--text3);
  }
  .empty-title { font-family: 'DM Serif Display', serif; font-size: 28px; color: var(--text2); margin-bottom: 8px; font-style: italic; }
  .empty-sub { font-size: 13px; line-height: 1.6; max-width: 280px; }

  .loading-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 60vh; gap: 16px; color: var(--text2);
  }
  .spinner {
    width: 32px; height: 32px;
    border: 2px solid var(--border2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 13px; color: var(--text3); }

  /* OUTPUT CARDS */
  .output-header {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 1.5rem;
  }
  .output-title { font-family: 'DM Serif Display', serif; font-size: 26px; font-style: italic; color: var(--text); }
  .copy-all-btn {
    font-size: 12px; color: var(--text3); background: none; border: 0.5px solid var(--border2);
    padding: 5px 12px; border-radius: 99px; cursor: pointer; font-family: 'DM Sans', sans-serif;
  }
  .copy-all-btn:hover { color: var(--text); background: var(--surface2); }

  .layer-card {
    background: var(--surface); border: 0.5px solid var(--border2);
    border-radius: var(--radius-lg); padding: 1.5rem; margin-bottom: 1rem;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .layer-head { display: flex; align-items: center; gap: 10px; margin-bottom: 1rem; }
  .layer-badge {
    font-size: 10px; font-weight: 500; letter-spacing: 0.06em;
    padding: 3px 10px; border-radius: 99px; text-transform: uppercase;
  }
  .badge-l1 { background: var(--l1-bg); color: var(--l1); border: 0.5px solid var(--l1-border); }
  .badge-l2 { background: var(--l2-bg); color: var(--l2); border: 0.5px solid var(--l2-border); }
  .badge-l3 { background: var(--l3-bg); color: var(--l3); border: 0.5px solid var(--l3-border); }
  .badge-angle { background: var(--surface2); color: var(--text2); border: 0.5px solid var(--border2); }
  .layer-name { font-size: 13px; font-weight: 500; color: var(--text); }
  .copy-btn {
    margin-left: auto; font-size: 11px; color: var(--text3);
    background: none; border: none; cursor: pointer; padding: 4px 8px;
    border-radius: var(--radius); font-family: 'DM Sans', sans-serif;
  }
  .copy-btn:hover { background: var(--surface2); color: var(--text); }
  .copy-btn.copied { color: var(--l2); }

  .layer-body { font-size: 13px; color: var(--text2); line-height: 1.8; }
  .field-row { margin-bottom: 12px; }
  .field-row:last-child { margin-bottom: 0; }
  .field-key { font-size: 10px; font-weight: 500; letter-spacing: 0.08em; color: var(--text3); text-transform: uppercase; margin-bottom: 3px; }
  .field-val { font-size: 13px; color: var(--text); line-height: 1.7; }
  .field-val.large { font-family: 'DM Serif Display', serif; font-size: 20px; font-style: italic; color: var(--text); }
  .field-val.mono { font-family: 'DM Mono', monospace; font-size: 12px; background: var(--bg); padding: 8px 12px; border-radius: var(--radius); line-height: 1.6; color: var(--text); word-break: break-all; }
  .field-val.slogan { font-size: 14px; font-style: italic; color: var(--accent); }
  .tag-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag-item {
    font-size: 12px; padding: 3px 10px; border-radius: 99px;
    background: var(--surface2); border: 0.5px solid var(--border); color: var(--text2);
  }
  .sep { border: none; border-top: 0.5px solid var(--border); margin: 12px 0; }
</style>
</head>
<body>

<header class="header">
  <div class="logo">Moodboard <span>Generator</span></div>
  <div class="key-area">
    <label>API Key</label>
    <input type="password" id="api-key" placeholder="sk-ant-api03-..." oninput="checkKey()">
    <span class="key-status no" id="key-status">未設定</span>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="mode-toggle">
      <button class="mode-btn active" id="btn-a" onclick="setMode('a')">關鍵詞 → 提示詞</button>
      <button class="mode-btn" id="btn-b" onclick="setMode('b')">圖片 → 文案</button>
    </div>

    <!-- MODE A -->
    <div id="pane-a">
      <div class="sec">
        <p class="sec-label">Layer 1 — 基本設定</p>
        <div class="two-col">
          <div class="field">
            <label>季節 / 檔期</label>
            <select id="season">
              <option value="">請選擇</option>
              <option>Spring</option><option>Summer</option>
              <option>Fall</option><option>Winter</option><option>自訂</option>
            </select>
          </div>
          <div class="field">
            <label>主角</label>
            <input type="text" id="char" placeholder="如 Bearista、旅人">
          </div>
        </div>
        <div class="field">
          <label>場景</label>
          <input type="text" id="scene" placeholder="如 海邊度假村、城市咖啡館">
        </div>
      </div>
      <hr class="divider">
      <div class="sec">
        <p class="sec-label">Layer 2 — 情感與風格</p>
        <div class="field">
          <label>情感氛圍</label>
          <div class="tag-group">
            <span class="tag" data-g="mood" onclick="tog(this,'am')">懷舊</span>
            <span class="tag" data-g="mood" onclick="tog(this,'am')">溫暖</span>
            <span class="tag" data-g="mood" onclick="tog(this,'am')">冒險</span>
            <span class="tag" data-g="mood" onclick="tog(this,'am')">神秘</span>
            <span class="tag" data-g="mood" onclick="tog(this,'am')">輕盈</span>
            <span class="tag" data-g="mood" onclick="tog(this,'am')">夢幻</span>
            <span class="tag" data-g="mood" onclick="tog(this,'am')">沉靜</span>
            <span class="tag" data-g="mood" onclick="tog(this,'am')">活潑</span>
          </div>
        </div>
        <div class="field" style="margin-top:10px">
          <label>視覺風格</label>
          <div class="tag-group">
            <span class="tag" data-g="style" onclick="tog(this,'as')">Vintage</span>
            <span class="tag" data-g="style" onclick="tog(this,'as')">Grandmillennial</span>
            <span class="tag" data-g="style" onclick="tog(this,'as')">Minimal</span>
            <span class="tag" data-g="style" onclick="tog(this,'as')">Playful</span>
            <span class="tag" data-g="style" onclick="tog(this,'as')">Dark Academia</span>
            <span class="tag" data-g="style" onclick="tog(this,'as')">Cottagecore</span>
            <span class="tag" data-g="style" onclick="tog(this,'as')">Retro</span>
            <span class="tag" data-g="style" onclick="tog(this,'as')">Editorial</span>
          </div>
        </div>
        <div class="field" style="margin-top:10px">
          <label>色彩傾向</label>
          <div class="tag-group">
            <span class="tag" data-g="color" onclick="tog(this,'ac')">大地色</span>
            <span class="tag" data-g="color" onclick="tog(this,'ac')">珊瑚橘</span>
            <span class="tag" data-g="color" onclick="tog(this,'ac')">莫蘭迪</span>
            <span class="tag" data-g="color" onclick="tog(this,'ac')">鮮豔對比</span>
            <span class="tag" data-g="color" onclick="tog(this,'ac')">黑白</span>
            <span class="tag" data-g="color" onclick="tog(this,'ac')">粉彩</span>
            <span class="tag" data-g="color" onclick="tog(this,'ac')">深色調</span>
          </div>
        </div>
      </div>
      <hr class="divider">
      <div class="sec">
        <p class="sec-label">Layer 3 — 補充定向</p>
        <div class="field">
          <label>自由關鍵字（最多 5 個）</label>
          <div class="kw-row">
            <input type="text" id="kw-in" placeholder="輸入後按新增或 Enter" onkeydown="if(event.key==='Enter')addKw()">
            <button onclick="addKw()">+ 新增</button>
          </div>
          <div class="chips" id="kw-chips"></div>
        </div>
        <div class="field" style="margin-top:10px">
          <label>Pinterest 參考圖</label>
          <button class="pinterest-btn" onclick="openPin()">↗ 開啟 Pinterest 搜尋</button>
          <div class="upload-zone" onclick="document.getElementById('fi-a').click()">
            <div class="upload-icon">↑</div>
            上傳參考圖片（1–5 張）
          </div>
          <input type="file" id="fi-a" multiple accept="image/*" style="display:none" onchange="handleFA(this.files)">
          <div class="chips" id="chips-a"></div>
        </div>
      </div>
      <div class="submit-row">
        <button class="btn-clear" onclick="clearA()">清除</button>
        <button class="btn-primary" id="gen-a" onclick="generateA()">生成三層提示詞</button>
      </div>
    </div>

    <!-- MODE B -->
    <div id="pane-b" style="display:none">
      <div class="sec">
        <p class="sec-label">上傳圖片</p>
        <div class="upload-zone" onclick="document.getElementById('fi-b').click()">
          <div class="upload-icon">↑</div>
          點擊上傳或拖曳圖片（1–5 張）
        </div>
        <input type="file" id="fi-b" multiple accept="image/*" style="display:none" onchange="handleFB(this.files)">
        <div class="chips" id="chips-b"></div>
      </div>
      <hr class="divider">
      <div class="sec">
        <p class="sec-label">詮釋方向關鍵字</p>
        <div class="kw-row">
          <input type="text" id="kw-in-b" placeholder="如 夏日、輕鬆、旅行" onkeydown="if(event.key==='Enter')addKwB()">
          <button onclick="addKwB()">+ 新增</button>
        </div>
        <div class="chips" id="kw-chips-b"></div>
      </div>
      <hr class="divider">
      <div class="sec">
        <p class="sec-label">輸出設定</p>
        <div class="field">
          <label>候選故事角度數量</label>
          <select id="angle-n" style="width:auto">
            <option value="2">2 個角度</option>
            <option value="3" selected>3 個角度</option>
            <option value="4">4 個角度</option>
          </select>
        </div>
      </div>
      <div class="submit-row">
        <button class="btn-clear" onclick="clearB()">清除</button>
        <button class="btn-primary" id="gen-b" onclick="generateB()">分析圖片並生成文案</button>
      </div>
    </div>
  </aside>

  <main class="main" id="main-output">
    <div class="empty-state">
      <div class="empty-title">還沒有內容</div>
      <div class="empty-sub">在左側填寫輸入條件，按下生成後提示詞會顯示在這裡。</div>
    </div>
  </main>
</div>

<script>
const kws = [], kwsB = [];

function checkKey() {
  const k = document.getElementById('api-key').value.trim();
  const st = document.getElementById('key-status');
  if (k.startsWith('sk-ant-')) { st.textContent = '已設定'; st.className = 'key-status ok'; }
  else { st.textContent = '未設定'; st.className = 'key-status no'; }
}

function setMode(m) {
  document.getElementById('pane-a').style.display = m === 'a' ? 'block' : 'none';
  document.getElementById('pane-b').style.display = m === 'b' ? 'block' : 'none';
  document.getElementById('btn-a').className = 'mode-btn' + (m === 'a' ? ' active' : '');
  document.getElementById('btn-b').className = 'mode-btn' + (m === 'b' ? ' active' : '');
  document.getElementById('main-output').innerHTML = '<div class="empty-state"><div class="empty-title">還沒有內容</div><div class="empty-sub">填寫左側條件後按下生成。</div></div>';
}

function tog(el, cls) { el.classList.toggle(cls); }
function getTags(g) {
  const cls = g === 'mood' ? 'am' : g === 'style' ? 'as' : 'ac';
  return Array.from(document.querySelectorAll(`.tag.${cls}[data-g="${g}"]`)).map(t => t.textContent);
}

function addKw() {
  const i = document.getElementById('kw-in'); const v = i.value.trim();
  if (!v || kws.length >= 5 || kws.includes(v)) { i.value = ''; return; }
  kws.push(v); renderChips('kw-chips', kws, removeKw); i.value = '';
}
function removeKw(i) { kws.splice(i, 1); renderChips('kw-chips', kws, removeKw); }
function addKwB() {
  const i = document.getElementById('kw-in-b'); const v = i.value.trim();
  if (!v || kwsB.length >= 3 || kwsB.includes(v)) { i.value = ''; return; }
  kwsB.push(v); renderChips('kw-chips-b', kwsB, removeKwB); i.value = '';
}
function removeKwB(i) { kwsB.splice(i, 1); renderChips('kw-chips-b', kwsB, removeKwB); }
function renderChips(id, arr, fn) {
  document.getElementById(id).innerHTML = arr.map((k, i) =>
    `<span class="chip">${k}<button onclick="${fn.name}(${i})">×</button></span>`).join('');
}
function handleFA(files) {
  document.getElementById('chips-a').innerHTML = Array.from(files).slice(0,5)
    .map(f => `<span class="chip">↑ ${f.name}</span>`).join('');
}
function handleFB(files) {
  document.getElementById('chips-b').innerHTML = Array.from(files).slice(0,5)
    .map(f => `<span class="chip">↑ ${f.name}</span>`).join('');
}
function openPin() {
  const scene = document.getElementById('scene').value || '';
  const season = document.getElementById('season').value || '';
  const styles = getTags('style');
  const q = [season, scene, ...styles].filter(Boolean).join(' ');
  window.open('https://www.pinterest.com/search/pins/?q=' + encodeURIComponent(q || 'vintage moodboard'), '_blank');
}
function clearA() {
  ['season','char','scene'].forEach(id => document.getElementById(id).value = '');
  document.querySelectorAll('.tag').forEach(t => t.className = 'tag');
  kws.length = 0; renderChips('kw-chips', kws, removeKw);
  document.getElementById('chips-a').innerHTML = '';
  document.getElementById('fi-a').value = '';
  document.getElementById('main-output').innerHTML = '<div class="empty-state"><div class="empty-title">還沒有內容</div><div class="empty-sub">填寫左側條件後按下生成。</div></div>';
}
function clearB() {

function getKey() { return document.getElementById('api-key').value.trim(); }

function showLoading() {
  document.getElementById('main-output').innerHTML = `
    <div class="loading-state">

      <div class="loading-text">AI 生成中，請稍候...</div>

async function callClaude(system, user) {
  const key = getKey();
  if (!key.startsWith('sk-ant-')) { alert('請先在右上角輸入有效的 API Key'); return null; }
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 1500,
      system,
      messages: [{ role: 'user', content: user }]
    })
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error?.message || `HTTP ${res.status}`);
  }
  const data = await res.json();
  return data.content?.map(b => b.text || '').join('') || '';
}

async function generateA() {
  const season = document.getElementById('season').value;

    "color_direction": "色彩指引關鍵字（英文，逗號分隔）",
    "pinterest_search": "建議Pinterest搜尋詞（中英文各一，換行分隔）"
  }
}`;

  const btn = document.getElementById('gen-a');
  btn.disabled = true;
  showLoading();

  try {
    const raw = await callClaude(sys, userPrompt);
    if (!raw) { btn.disabled = false; return; }
    const parsed = JSON.parse(raw.replace(/```json|```/g, '').trim());
    renderA(parsed, userPrompt);
  } catch (e) {
    document.getElementById('main-output').innerHTML = `<div class="empty-state"><div class="empty-title" style="color:#C4531A">生成失敗</div><div class="empty-sub">${e.message}</div></div>`;
  }

}

function copyText(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    const orig = btn.textContent;
    btn.textContent = '已複製 ✓';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 1500);
  });
}
